<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1A8F83">
  <title>لوحة التحكم</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="admin.css?v=1">
</head>
<body>
  <!-- ============ تسجيل الدخول ============ -->
  <main id="login" class="login" hidden>
    <div class="login-card">
      <img src="/assets/logo.png" alt="" class="login-logo" width="200" height="107">
      <h1>لوحة التحكم</h1>

      <div id="step1">
        <p class="muted">الخطوة 1 من 2 · سجّل الدخول بحساب Google الخاص بالمدير</p>
        <div id="gbtn" class="gbtn"></div>
        <p id="cfgErr" class="err" hidden></p>
      </div>

      <form id="step2" hidden>
        <p class="muted">الخطوة 2 من 2 · أدخل مفتاح الدخول</p>
        <div class="who" id="whoEmail"></div>
        <label class="field">
          <span>مفتاح الدخول</span>
          <input type="password" id="keyInput" autocomplete="current-password" required dir="ltr" spellcheck="false">
        </label>
        <button class="btn primary block" id="keyBtn" type="submit">دخول</button>
        <button class="btn link" id="backBtn" type="button">استخدام حساب Google آخر</button>
      </form>

      <p id="loginErr" class="err" role="alert" hidden></p>
    </div>
  </main>

  <!-- ============ التطبيق ============ -->
  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="side-brand"><img src="/assets/emblem.png" alt="" width="32" height="32"><strong>لوحة التحكم</strong></div>
      <nav id="nav" class="nav">
        <button data-view="overview" class="on"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span>نظرة عامة</span></button>
        <button data-view="products"><svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5V8z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg><span>المنتجات</span></button>
        <button data-view="categories"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>الأقسام</span></button>
        <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>الإعدادات</span></button>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank" rel="noopener" class="btn ghost block">عرض الموقع ↗</a>
        <div class="me" id="meEmail"></div>
        <button class="btn link" id="logoutBtn" type="button">تسجيل الخروج</button>
      </div>
    </aside>

    <main class="main">
      <header class="page-head">
        <h2 id="pageTitle"></h2>
        <div class="head-actions" id="headActions"></div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/qr/qrcode.js"></script>
  <script src="admin.js?v=1"></script>
</body>
</html>
